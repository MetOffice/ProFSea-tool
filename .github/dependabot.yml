version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "profsea-v3"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-updates:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "profsea-v3"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-dependencies:
        patterns:
          - "*"