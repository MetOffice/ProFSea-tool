name: Release

# Publishing a GitHub release uploads that commit to PyPI. The release tag must be
# "v" plus the version in pyproject.toml (e.g. v3.0.0), and PyPI accepts each version
# only once. Running the workflow by hand uploads to TestPyPI instead, as a dry run.
#
# Setup (once): add an API token as the PYPI_API_TOKEN secret of a "pypi" environment
# (and TEST_PYPI_API_TOKEN of a "testpypi" environment for dry runs). Required
# reviewers on the "pypi" environment add a manual approval step before upload.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version} (expected v${version})."
            exit 1
          fi

      - name: Run the test suite
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/ -q

      - name: Build the sdist and wheel
        run: |
          pip install build twine
          rm -rf dist
          python -m build
          twine check --strict dist/*

      - name: Check the wheel contents
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          problems = []
          if not any(n.startswith("profsea/auxiliary_data/component-obs/") for n in names):
              problems.append("auxiliary_data is missing")
          for unwanted in ("profsea-assets/", "profsea/development/", "tests/"):
              if any(unwanted in n for n in names):
                  problems.append(f"{unwanted} should not be packaged")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Smoke test the installed wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp  # import the installed package, not the checkout
          /tmp/wheel-env/bin/python - <<'EOF'
          from pathlib import Path
          import profsea
          from profsea.utils import assets_dir, read_greenland_obs
          from profsea.components.global_ import AntarcticaISMIP6
          read_greenland_obs(1995, 2014)  # bundled observations load
          AntarcticaISMIP6(region="wais")  # bundled calibration loads
          package = Path(profsea.__file__).parent
          assert package not in assets_dir().parents, "assets would be written into the package"
          print("Installed", profsea.__name__, "from", package)
          EOF

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to ${{ github.event_name == 'release' && 'PyPI' || 'TestPyPI' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload with twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ github.event_name == 'release' && secrets.PYPI_API_TOKEN || secrets.TEST_PYPI_API_TOKEN }}
          TWINE_REPOSITORY: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
        run: |
          pip install twine
          twine upload --non-interactive dist/*
