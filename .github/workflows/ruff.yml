name: Ruff Linter and Formatter

on:
  push:
    branches:
      - 'profsea-v3'

  pull_request:
    branches:
      - profsea-v3

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The official Ruff action is pre-compiled and runs instantly
      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v1
        with:
          # Checks for linting errors (unused imports, syntax errors, etc.)
          args: "check --output-format=github ."

      - name: Run Ruff Formatter
        uses: astral-sh/ruff-action@v1
        with:
          # Checks if the code is properly formatted
          args: "format --check ."